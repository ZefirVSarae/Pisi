<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Фиолетовые Тапки Новости</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(to bottom, #8A2BE2, #000000);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: white;
    }

    #clock {
      font-size: 96px;
      font-weight: bold;
      color: white;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
      z-index: 9999;
      text-align: center;
      position: relative;
    }

    /* Бегущая строка */
    #news-ticker-container {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.85);
      padding: 12px 0;
      box-shadow: 0 -2px 15px rgba(138, 43, 226, 0.4);
      z-index: 9998;
      overflow: hidden;
    }

    #news-ticker {
      display: inline-block;
      white-space: nowrap;
      font-size: 22px;
      color: #e0ccff;
      font-weight: bold;
      animation: scroll-left 40s linear infinite;
    }

    @keyframes scroll-left {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>
<body>

  <div id="clock">--:--:--</div>

  <div id="news-ticker-container">
    <div id="news-ticker">Загрузка новостей...</div>
    <div id="audio-container" style="display: none;"></div>
  </div>

  <script>
    // === Генератор "новостей от Gemini-2.0-Flash" ===
    function generateAbsurdNews() {
      const subjects = [
        "Фиолетовые тапки",
        "Пара фиолетовых тапок",
        "Тапки цвета космического заката",
        "Магические фиолетовые шлёпанцы",
        "Интеллектуальные тапки с ИИ",
        "Фиолетовые тапки из будущего"
      ];

      const verbs = [
        "объявили войну",
        "вступили в переговоры с",
        "похитили",
        "научились управлять",
        "открыли секреты",
        "подали иск против",
        "запустили стартап по",
        "начали транслировать мысли",
        "стали мэром",
        "внедрились в правительство"
      ];

      const objects = [
        "обычным носкам",
        "мировым правительствам",
        "котами",
        "интернетом",
        "погодой",
        "кофемашинами",
        "спутниками Starlink",
        "МКС",
        "алгоритмами TikTok",
        "Гугл-переводчиком"
      ];

      const locations = [
        "в Подмосковье",
        "на Марсе",
        "в супермаркете 'Пятёрочка'",
        "в Цюрихе",
        "у вас дома",
        "в подвале у бабушки",
        "в штаб-квартире ООН",
        "на дне океана"
      ];

      const absurdDetails = [
        "после того как научились готовить пельмени",
        "благодаря хз чему",
        "в рамках борьбы за права обуви",
        "после получения докторской степени в MIT",
        "после того как начали вещать на FM-волне",
        "в ответ на повышение цен на носки"
      ];

      const subject = subjects[Math.floor(Math.random() * subjects.length)];
      const verb = verbs[Math.floor(Math.random() * verbs.length)];
      const object = objects[Math.floor(Math.random() * objects.length)];
      const location = locations[Math.floor(Math.random() * locations.length)];
      const detail = absurdDetails[Math.floor(Math.random() * absurdDetails.length)];

      return `Новости HARE TV сообщает: ${subject} ${verb} ${object} ${location} ${detail}!`;
    }

    // Генерируем новость при загрузке
    document.getElementById('news-ticker').textContent = generateAbsurdNews();

    // === Часы по Московскому времени ===
    function updateMoscowTime() {
      const now = new Date();
      const options = {
        timeZone: 'Europe/Moscow',
        hour12: false,
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      };
      const moscowTime = new Intl.DateTimeFormat('ru-RU', options).format(now);
      document.getElementById('clock').textContent = moscowTime;
    }
    updateMoscowTime();
    setInterval(updateMoscowTime, 1000);

    // === Видео и Аудио каждые 15–60 минут ===
    // *** ИЗМЕНИТЕ ЭТИ ИМЕНА ФАЙЛОВ на те, что у вас в папке 'videos/' ***
    const videos = [
      'videos/video_file_1.mp4',
      'videos/video_file_2.mp4',
      'videos/my_epic_clip.mp4', // Пример .mp4
      'videos/audio_track_1.mp3', // Пример .mp3
      'videos/music_jingle.mp3' // Еще один пример .mp3
    ];

    // Глобальная переменная для отслеживания текущего медиаэлемента
    let currentMediaElement = null;

    function playRandomVideo() {
      // Удаляем предыдущий элемент, если он есть
      if (currentMediaElement && document.body.contains(currentMediaElement)) {
        document.body.removeChild(currentMediaElement);
      }

      const randomMedia = videos[Math.floor(Math.random() * videos.length)];
      
      // Проверка, является ли файл аудио (.mp3)
      const isAudio = randomMedia.toLowerCase().endsWith('.mp3'); 
      
      // Используем тег <video> для .mp4 и тег <audio> для .mp3
      const mediaElement = document.createElement(isAudio ? 'audio' : 'video');
      currentMediaElement = mediaElement;

      mediaElement.controls = false;
      mediaElement.muted = false; // Разрешаем звук по умолчанию
      mediaElement.loop = false;
      mediaElement.src = randomMedia;

      // Стилизация для ВИДЕО (.mp4)
      if (!isAudio) {
        mediaElement.style.position = 'fixed';
        mediaElement.style.top = '0';
        mediaElement.style.left = '0';
        mediaElement.style.width = '100%';
        mediaElement.style.height = '100%';
        mediaElement.style.zIndex = '10000'; // Поверх всего
        mediaElement.style.objectFit = 'cover';
        document.body.appendChild(mediaElement); // Добавляем в тело
      } else {
        // Для АУДИО (.mp3)
        // Аудио будет невидимым, но будет проигрываться
        mediaElement.style.display = 'none';
        document.body.appendChild(mediaElement); // Добавляем в тело
      }


      // Обработчик ошибок загрузки
      mediaElement.onerror = () => {
        console.error(`❌ Ошибка загрузки медиафайла: ${randomMedia}. Проверьте правильность пути и наличие файла.`);
        if(document.body.contains(mediaElement)) {
          document.body.removeChild(mediaElement);
          currentMediaElement = null;
        }
      };

      // Логика завершения: удаляем элемент, когда проигрывание закончилось
      mediaElement.onended = () => {
        if(document.body.contains(mediaElement)) {
          document.body.removeChild(mediaElement);
          currentMediaElement = null;
        }
      };

      // Запускаем воспроизведение
      mediaElement.play().catch(e => {
        console.warn(`Автовоспроизведение "${randomMedia}" заблокировано браузером (Autoplay Policy) или другая ошибка. Попробуйте кликнуть по странице, чтобы запустить.`, e);
      });
    }

    function scheduleNextVideo() {
      const min = 15 * 60 * 1000;
      const max = 60 * 60 * 1000;
      const delay = Math.floor(Math.random() * (max - min + 1)) + min;

      setTimeout(() => {
        playRandomVideo();
        scheduleNextVideo();
      }, delay);
    }

    scheduleNextVideo();
  </script>

</body>
</html>
