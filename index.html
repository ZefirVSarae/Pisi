<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таймер со Скрытым Видео (Случайный Выбор)</title>
    <!-- Загрузка Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap" rel="stylesheet">
    <style>
        /* Стиль для эффекта свечения, как на вашем изображении */
        .glow-text {
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.6), 0 0 30px rgba(255, 255, 255, 0.4);
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.1em;
        }

        /* Фиолетовый градиентный фон */
        .purple-gradient {
            background: radial-gradient(circle at center, #8a2be2 0%, #4b0082 100%);
        }
    </style>
</head>
<body class="purple-gradient min-h-screen flex flex-col items-center justify-center p-4 relative">

    <!-- Скрытый контейнер для видео. Занимает весь экран. -->
    <!-- Класс 'hidden' скрывает его по умолчанию -->
    <div id="video-container" 
         class="fixed inset-0 w-screen h-screen flex items-center justify-center bg-black z-10 hidden">
        
        <!-- Видео элемент: controls убраны, чтобы не было видно элементов управления. -->
        <!-- object-cover и w-full h-full гарантируют, что видео займет весь экран. -->
        <!-- Атрибут 'src' будет установлен динамически через JavaScript -->
        <video id="secret-video" 
               class="object-cover w-full h-full" 
               playsinline 
               type="video/mp4">
            Ваш браузер не поддерживает тег video.
        </video>
        
    </div>

    <!-- Главный контейнер для часов -->
    <div id="clock-container" class="text-center transition-opacity duration-300 z-0">
        <!-- Цифровые часы -->
        <div id="clock" class="glow-text text-white text-6xl sm:text-8xl md:text-9xl font-bold">
            00:00:00
        </div>

        <!-- Невидимая кнопка / Область нажатия -->
        <div id="hidden-button" 
             class="w-full max-w-lg h-24 mt-8 cursor-pointer" 
             onclick="showVideo()">
        </div>
    </div>

    <script>
        // Глобальные переменные
        // Список всех видео. Все ссылки модифицированы на dl=1 для прямого воспроизведения.
        const VIDEO_SOURCES = [
            // Исходное видео
            "https://www.dropbox.com/scl/fi/6a7evfakclrrkpatretee/purple-hare-1-season.mp4?rlkey=ehmtfjlo8nwdo4lsz9lmiy1fn&st=utaco1y4&dl=1",
            // Новые видео
            "https://www.dropbox.com/scl/fi/yzegvcel7xu19t8f3dbpb/Purple-Hare-13.mp4?rlkey=7gntat0h9x8uwburs5k3ykyxz&st=298s8mod&dl=1",
            "https://www.dropbox.com/scl/fi/o55jndrit09yyywny5y28/purple-hare-10.mp4?rlkey=mbt1tx08ik1zlk9224u0rmyqc&st=r5t714oo&dl=1",
            "https://www.dropbox.com/scl/fi/0uvbqjkmlb1y5q2rop41i/Purple-Hare-15.mp4?rlkey=jkw28zo6x5mls22kdp8lmpyrl&st=1if6yudd&dl=1",
            "https://www.dropbox.com/scl/fi/naz5jyqtosyznb2yt19b6/purple-hare-7.mp4?rlkey=6trhwzw8guubkgfy8nf97kesf&st=qnp5sauf&dl=1"
        ];
        
        // Если вы хотите, чтобы после видео происходило перенаправление на другую внешнюю страницу,
        // измените значение этой переменной на нужный URL и раскомментируйте соответствующую строку в функции handleVideoEnd.
        const REDIRECT_AFTER_VIDEO = ""; // Здесь можно указать другой URL, например, "https://example.com"
        
        const clockElement = document.getElementById('clock');
        const clockContainer = document.getElementById('clock-container');
        const videoContainer = document.getElementById('video-container');
        const secretVideo = document.getElementById('secret-video');
        const hiddenButton = document.getElementById('hidden-button');
        
        // Стилизуем невидимую кнопку через JS, чтобы она была невидимой, но кликабельной
        hiddenButton.style.opacity = 0;

        /**
         * Обновляет цифровые часы каждую секунду.
         */
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            clockElement.textContent = `${hours}:${minutes}:${seconds}`;
        }

        /**
         * Обрабатывает окончание видео (onended).
         * По умолчанию возвращает пользователя к таймеру.
         */
        function handleVideoEnd() {
            if (REDIRECT_AFTER_VIDEO) {
                // Если указана внешняя ссылка, перенаправляем
                window.location.href = REDIRECT_AFTER_VIDEO;
            } else {
                // По умолчанию: возвращаемся к таймеру ("та страница")
                
                // 1. Остановить видео и сбросить на начало
                secretVideo.pause();
                secretVideo.currentTime = 0; 

                // 2. Скрыть видео и показать таймер
                videoContainer.classList.add('hidden');
                clockContainer.classList.remove('hidden');
                console.log("Видео закончилось. Возврат к таймеру.");
            }
        }


        /**
         * Показывает видео и скрывает часы.
         */
        function showVideo() {
            console.log("Секретное видео активировано.");

            // 1. Выбираем случайное видео
            const randomIndex = Math.floor(Math.random() * VIDEO_SOURCES.length);
            const selectedVideoUrl = VIDEO_SOURCES[randomIndex];
            
            // 2. Устанавливаем и загружаем новый источник видео
            secretVideo.src = selectedVideoUrl;
            secretVideo.load();

            // 3. Скрыть контейнер часов 
            clockContainer.classList.add('hidden');
            
            // 4. Показать контейнер видео
            videoContainer.classList.remove('hidden');
            
            // 5. Устанавливаем обработчик события 'ended'
            // Когда видео закончится, вызывается функция handleVideoEnd
            secretVideo.onended = handleVideoEnd;

            // 6. Запустить воспроизведение видео
            secretVideo.play().catch(error => {
                // Если автозапуск не сработал (из-за правил браузера), выводим ошибку в консоль.
                console.error("Ошибка воспроизведения видео. Возможно, браузер требует дополнительного взаимодействия:", error);
                
                // Чтобы видео можно было запустить вручную, временно показываем контролы
                secretVideo.controls = true; 
            });
        }

        /**
         * Инициализация приложения при загрузке страницы.
         */
        window.onload = function() {
            // Устанавливаем часы сразу и начинаем обновление
            updateClock();
            setInterval(updateClock, 1000);

            console.log("Сайт готов. Таймер запущен. Доступно " + VIDEO_SOURCES.length + " видео.");
        };
    </script>
</body>
</html>

  </script>

</body>
</html>
